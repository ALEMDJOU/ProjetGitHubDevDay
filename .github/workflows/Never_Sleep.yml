name: Never Sleep

# Render free web services spin down after 15 minutes without traffic. This job pings
# /health to wake the instance up and keep it warm.
#
# Measured reality: GitHub does not honour very frequent crons. Between 01/10 and 12/10/2026
# this "every 10 minutes" schedule actually ran ~5 times a day (median gap ~5 h), so it is
# only a safety net. For an always-warm demo, add an external pinger that really calls
# /health every 5 minutes (e.g. UptimeRobot or cron-job.org, both free): see README.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: never-sleep
  cancel-in-progress: true

jobs:
  ping:
    name: Keep the service awake
    runs-on: ubuntu-latest
    timeout-minutes: 6
    # Same environment as deploy.yml, so the job reads the APP_URL defined on `production`.
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL is empty: set it on the production environment"
            exit 1
          fi

      # A cold start takes ~45 s and the instance may answer errors while it boots:
      # keep polling for up to ~4 minutes instead of failing on the first error.
      - name: Ping /health
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$APP_URL/health" || true)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::$APP_URL/health still not answering 200 after ~4 minutes"
          exit 1
