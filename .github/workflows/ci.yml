name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: lint-test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # The image bakes in a model, so train one first (a few seconds).
      - name: Train model for the image
        run: |
          pip install -r requirements.txt
          python -m avoripe.train
      - name: Build image
        run: docker build -t avoripe:ci .
      - name: Run container and check /health
        run: |
          docker run -d --name avoripe -p 7860:7860 avoripe:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:7860/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs avoripe
          exit 1
