name: Train & Evaluate

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/avoripe/config.py"
      - "src/avoripe/data.py"
      - "src/avoripe/train.py"
      - "src/avoripe/evaluate.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      min_f1:
        description: "Quality gate: minimum macro F1 (empty = repo variable MIN_F1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  train:
    name: Train, evaluate, gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train
        run: python -m avoripe.train
      - name: Evaluate (quality gate)
        env:
          MIN_F1: ${{ github.event.inputs.min_f1 || vars.MIN_F1 }}
        run: python -m avoripe.evaluate
      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f metrics/report.md ]; then
            cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model artifact
        uses: actions/upload-artifact@v7
        with:
          name: model
          path: |
            models/model.joblib
            metrics/metrics.json
          retention-days: 30
          if-no-files-found: error
