# Train & Evaluate: trains the model, scores it and applies the quality gate.
# A green run uploads the `model` artifact, which triggers deploy.yml automatically.
# A red run (macro F1 < MIN_F1) uploads nothing, so nothing gets deployed.
name: Train & Evaluate

on:
  # Retrain only when something that can change the model changes.
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/avoripe/config.py"
      - "src/avoripe/data.py"
      - "src/avoripe/train.py"
      - "src/avoripe/evaluate.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  # Weekly retrain: catches dependency drift even when nobody pushes.
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  # Manual run from the Actions tab, with an optional stricter/looser gate.
  workflow_dispatch:
    inputs:
      min_f1:
        description: "Quality gate: minimum macro F1 (empty = repo variable MIN_F1)"
        required: false
        default: ""

permissions:
  contents: read

# Never cancel a training run halfway: queue the next one instead.
concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  train:
    name: Train, evaluate, gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Train
        run: python -m avoripe.train
      # Exits with code 1 when macro F1 < MIN_F1, which stops the workflow here.
      # MIN_F1 priority: manual input > repository variable > default in config.py.
      - name: Evaluate (quality gate)
        env:
          MIN_F1: ${{ github.event.inputs.min_f1 || vars.MIN_F1 }}
        run: python -m avoripe.evaluate
      # always(): show the metrics table even when the gate failed, to explain why.
      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f metrics/report.md ]; then
            cat metrics/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      # Only reached when the gate passed. deploy.yml downloads this artifact.
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: |
            models/model.joblib
            metrics/metrics.json
          retention-days: 30
          if-no-files-found: error
