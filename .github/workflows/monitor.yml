# Monitor: every 6 hours, check that the live API is up AND still predicts correctly.
# If either check fails, open a GitHub issue with a link to the failing run.
name: Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Read the repo (for the fixture file) and open issues on failure.
permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check live service
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check /health
        run: curl -fsS --retry 3 --retry-delay 10 "$APP_URL/health" | tee health.json | grep -q '"model_loaded":true'

      # Known prediction: one real photo from the dataset, stored in tests/fixtures.
      - name: Check a known prediction
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST "$APP_URL/predict" \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/known_sample.json | tee prediction.json
          python3 -c "import json; p = json.load(open('prediction.json')); assert p['ripeness'] in p['probabilities']"

      # Try with a `monitoring` label first; if the label does not exist, retry without it.
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "🚨 Monitor: live service check failed ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --body "The scheduled check of \`$APP_URL\` failed. See the run: $RUN_URL" \
            --label monitoring || \
          gh issue create \
            --title "🚨 Monitor: live service check failed ($(date -u +%Y-%m-%dT%H:%MZ))" \
            --body "The scheduled check of \`$APP_URL\` failed. See the run: $RUN_URL"
