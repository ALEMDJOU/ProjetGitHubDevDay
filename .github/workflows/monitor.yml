# Monitor: every 6 hours, check that the live API is up AND still predicts correctly.
# The free Render instance sleeps when idle, so the job first gives it time to wake up;
# only an API that is still unreachable (or wrong) after that opens or updates an issue.
name: Monitor

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Read the repo (for the fixture file) and open issues on failure.
permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check live service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same environment as deploy.yml, so the job reads the APP_URL defined on `production`.
    environment: production
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Variable APP_URL is empty: set it on the production environment"
            exit 1
          fi

      # A sleeping free instance answers after ~45 s, sometimes with errors while it boots.
      # Poll for up to ~4 minutes before judging: a cold start is not an outage.
      - name: Wake up the service
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$APP_URL/health" || true)
            echo "attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::$APP_URL/health still not answering 200 after the wake-up window"
          exit 1

      - name: Check /health
        run: curl -fsS -m 30 --retry 3 --retry-delay 10 "$APP_URL/health" | tee health.json | grep -q '"model_loaded":true'

      # Known prediction: one real photo from the dataset, stored in tests/fixtures.
      - name: Check a known prediction
        run: |
          curl -fsS -m 30 --retry 3 --retry-delay 10 -X POST "$APP_URL/predict" \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/known_sample.json | tee prediction.json
          python3 -c "import json; p = json.load(open('prediction.json')); assert p['ripeness'] in p['probabilities']"

      # One open issue per incident: comment on it if it exists, otherwise create it.
      - name: Report failure in an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 Monitor: live service check failed"
          BODY="Check of \`${APP_URL:-<APP_URL is empty>}\` failed at $(date -u +%Y-%m-%dT%H:%MZ). Run: $RUN_URL"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
