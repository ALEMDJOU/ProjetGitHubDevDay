# Deploy: ships a model that passed the quality gate.
# 1. find the green "Train & Evaluate" run and download its `model` artifact;
# 2. build the Docker image (model + API) and push it to GHCR, tagged with the commit SHA;
# 3. tell Render to run that exact image (deploy hook), then wait until the live /health
#    reports the same SHA;
# 4. optionally push the same files to a Hugging Face Space (only if HF_SPACE is set).
name: Deploy

on:
  workflow_run:
    workflows: ["Train & Evaluate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of a 'Train & Evaluate' run (empty = latest successful run on main)"
        required: false
        default: ""

# Least privilege: read code, read another run's artifact, push the image to GHCR.
permissions:
  contents: read
  actions: read # download the artifact from another run
  packages: write # push to GHCR

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Package & deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The `production` environment holds the deploy secrets and can require an approval.
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      RUN_ID: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      # Never report success without deploying anywhere.
      - name: Check deploy target
        env:
          APP_URL: ${{ vars.APP_URL }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$APP_URL" ] && [ -z "$HF_SPACE" ]; then
            echo "::error::No deploy target: set the variable APP_URL (Render URL) or HF_SPACE"
            exit 1
          fi
          echo "APP_URL=${APP_URL:-<unset>} HF_SPACE=${HF_SPACE:-<unset>}"

      # Manual run without run_id: pick the latest successful training run on main.
      - name: Resolve training run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(echo "$RUN_ID" | tr -d '[:space:]')"
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow train.yml --branch main \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful 'Train & Evaluate' run found on main"; exit 1
          fi
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "model" and .expired == false)] | length' || echo 0)
          if [ "$COUNT" != "1" ]; then
            echo "::error::Run $RUN_ID has no 'model' artifact. Use the ID of a green 'Train & Evaluate' run."
            exit 1
          fi
          echo "Deploying model from Train & Evaluate run $RUN_ID"
          echo "TRAIN_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download model artifact
        uses: actions/download-artifact@v8
        with:
          name: model
          run-id: ${{ env.TRAIN_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact

      - name: Place model
        run: |
          mkdir -p models metrics
          mv artifact/models/model.joblib models/model.joblib
          mv artifact/metrics/metrics.json metrics/metrics.json
          cat metrics/metrics.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SOURCE_SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SOURCE_SHA }}
            ${{ env.IMAGE }}:latest

      # Render (primary target): redeploy the image-backed service with the new tag.
      - name: Deploy to Render
        if: vars.APP_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is empty: add it as a SECRET of environment 'production'"
            exit 1
          fi
          IMG=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMAGE'] + ':' + os.environ['SOURCE_SHA'], safe=''))")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=${IMG}" -o /dev/null
          echo "Render deploy triggered for $IMAGE:$SOURCE_SHA"

      - name: Smoke test live /health (new version)
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          # Wait until the live service reports the SHA we just deployed (up to ~10 minutes).
          for i in $(seq 1 60); do
            BODY=$(curl -fsS -m 20 "$APP_URL/health" || true)
            if echo "$BODY" | grep -q "\"version\":\"$SOURCE_SHA\"" \
              && echo "$BODY" | grep -q '"model_loaded":true'; then
              echo "Live: $BODY"; exit 0
            fi
            sleep 10
          done
          echo "::error::$APP_URL did not serve version $SOURCE_SHA in time (last: $BODY)"; exit 1

      # Hugging Face Space (optional): only when the HF_SPACE variable is set.
      - uses: actions/setup-python@v5
        if: vars.HF_SPACE != ''
        with:
          python-version: "3.11"

      - name: Push to Hugging Face Space
        if: vars.HF_SPACE != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Secret HF_TOKEN is empty: add it as a SECRET of environment 'production'"; exit 1
          fi
          pip install huggingface_hub
          python -c "from huggingface_hub import whoami; print('Authenticated on Hugging Face as', whoami()['name'])"
          echo "Deploying to Space: $HF_SPACE"
          mkdir -p space
          cp -r Dockerfile requirements.txt src models space/
          cp deploy/space_README.md space/README.md
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              folder_path="space",
              repo_id=os.environ["HF_SPACE"],
              repo_type="space",
              commit_message=f"Deploy {os.environ['SOURCE_SHA'][:7]} (run {os.environ['TRAIN_RUN_ID']})",
              # Remove stale code and the default files of a freshly created Space.
              delete_patterns=["src/**", "index.html", "style.css"],
          )
          PY
