version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # streamlit 1.64 requires pillow<13: a pillow 13 bump cannot be installed (CI fails at
    # "Install dependencies"). Remove this rule once streamlit accepts pillow 13.
    ignore:
      - dependency-name: "pillow"
        versions: [">=13"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # The stack is pinned to Python 3.11: only take patch/security updates of the base image.
    ignore:
      - dependency-name: "python"
        versions: [">=3.12"]
    commit-message:
      prefix: "chore(docker)"
