version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # The stack is pinned to Python 3.11: only take patch/security updates of the base image.
    ignore:
      - dependency-name: "python"
        versions: [">=3.12"]
    commit-message:
      prefix: "chore(docker)"
